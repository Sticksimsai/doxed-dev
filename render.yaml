# Render Blueprint: one Node web service (API + frontend) and a Postgres database.
services:
  - type: web
    runtime: node
    name: doxed-dev
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: doxed-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "true"
      - key: KYD_PROVIDER # auto = Didit when DIDIT_API_KEY is set, otherwise instant mock approval
        value: auto
      - key: ALLOW_MOCK_KYD # lets the mock run before Didit is connected; ignored once Didit keys are set
        value: "true"
      - key: HELIUS_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: X_BEARER_TOKEN
        sync: false

databases:
  - name: doxed-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
