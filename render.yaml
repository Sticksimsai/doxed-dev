# Render Blueprint: one Node web service (API + frontend) and a Postgres database.
services:
  - type: web
    runtime: node
    name: doxed-dev
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: doxed-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "true"
      - key: KYD_PROVIDER # auto = Didit when DIDIT_API_KEY is set, otherwise instant mock approval
        value: auto
      - key: ALLOW_MOCK_KYD # lets the mock run before Didit is connected; ignored once Didit keys are set
        value: "true"
      # ---- secrets: paste in Render → doxed-dev → Environment (placeholders count as "not set")
      - key: ADMIN_WALLETS # your Solana wallet(s), comma separated — unlocks /admin
        sync: false
      - key: OPENROUTER_API_KEY # Builder API master key; also powers AI summaries if no Anthropic key
        sync: false
      - key: HELIUS_API_KEY # Solana RPC + fee-claim history
        sync: false
      - key: DIDIT_API_KEY # ID scan + face scan
        sync: false
      - key: DIDIT_WEBHOOK_SECRET
        sync: false
      - key: PINATA_JWT # Pump.fun metadata uploads
        sync: false
      - key: TREASURY_WALLET # where launch fees go
        sync: false
      - key: ANTHROPIC_API_KEY # optional — AI runs on the Builder key without it
        sync: false
      - key: GITHUB_TOKEN # optional — higher limits for repo reviews
        sync: false
      - key: X_BEARER_TOKEN # optional — recent X posts in summaries
        sync: false
      # ---- settings with sensible defaults
      - key: ID_HASH_SECRET # keys the duplicate-ID guard; never change once live
        generateValue: true
      - key: LAUNCH_FEE_SOL
        value: "0"
      - key: BUILDER_MONTHLY_CREDIT_USD
        value: "100"
      - key: BUILDER_RPM
        value: "60"
      - key: BUILDER_MAX_KEYS
        value: "5"
      - key: BUILDER_MAX_TOKENS
        value: "8192"
      - key: RUN_JOBS
        value: "true"

databases:
  - name: doxed-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
